<div class="container mt-5">
  <div class="card shadow">
    <div class="card-body">
      
      <h1 class="text-center">Connexion</h1>
      
      <div class="mb-4 mt-4">
        <input type="text" id="login"
               class="form-control" 
               [(ngModel)]="login" 
               placeholder="login">
      </div>
      
      <div class="mb-4">
        <input type="password" 
               class="form-control" id="pwd"
               [(ngModel)]="password" 
               placeholder="Mot de passe">
      </div>
      
      <button  id="connect" class="btn btn-info w-100" (click)=" onSubmit()">
        Se Connecter
      </button>
      
    </div>
  </div>
</div>
