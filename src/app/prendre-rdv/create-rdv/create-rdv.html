<div class="card">
        <div class="card-header"><h1>Prendre un rendez-vous</h1></div>
        <div class="card-body">
            <div class="row">
                <div class="col"><input type="text" placeholder="Nom" ></div>
                <div class="col"><input type="text" placeholder="Prenom" ></div>
            </div>
            
            <div class="row">
                <div class="col-12">
                    <input type="date" >
                </div>
                <div class="col-12">
                    <input type="datetime" placeholder="Choisir une heure">
                </div>
            </div>
            <div class="row">
                <input type="text" placeholder="Spécialité médicale">
            </div>
            <div class="row">
                <div class="col -md-8">
                    <button type="btn btn-primary" >Prendre un rendez-vous</button>
                </div>
                <div class="col-md-4">
                    <button type="btn btn-primary" >Annuler</button>
                </div>
            </div>
        </div>
</div>
