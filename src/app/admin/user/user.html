<div class="card shadow-sm border-0 text-center p-3" style="border-radius: 20px;">
  <div class="card-body">
    <h5 class="fw-bold">{{ name }}</h5>
    <p class="text-uppercase text-secondary small mb-4">{{ profil }}</p>
    
    <div class="text-start mb-4" style="font-size: 0.9rem;">
      <p class="mb-1"><strong>Email :</strong> {{ email }}</p>
      <p class="mb-0"><strong>Tel :</strong> {{ tel }}</p>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-outline-info w-100 rounded-pill">Modifier</button>
      <button class="btn btn-danger w-100 rounded-pill" style="background-color: #ff8a8a; border: none;">Archiver</button>
    </div>
  </div>
</div>
