<div class="page-wrapper">

  <div class="header d-flex justify-content-between align-items-center">

    <div class="logo-container">
      <img src="logo.png" alt="logo sa7tiPlus">
      <h2 class="bienvenue-text">
        Bienvenue, {{ nomPrenom }}
      </h2>
    </div>

    <button (click)="logout()" class="btn btn-logout">
      Déconnexion
    </button>

  </div>

 
  <div class="filters">
    <button (click)="filterByProfil('Tous')" class="btn btn-filter">Tous</button>
    <button (click)="filterByProfil('Médecin')" class="btn btn-filter">Médecins</button>
    <button (click)="filterByProfil('Patient')" class="btn btn-filter">Patients</button>
    <button (click)="goToAddUser()" class="btn btn-create">Créer user</button>
  </div>

  
  <div class="cards-grid">

    <div class="card-user" *ngFor="let u of filteredUsers">

      <h5>{{ u.prenom }} {{ u.nom }}</h5>
      <p class="role">{{ u.profil }}</p>

      <div class="info">
        <p><strong>Email :</strong> {{ u.email }}</p>
        <p><strong>Tel :</strong> {{ u.tel }}</p>
        <p *ngIf="u.profil === 'Médecin' && u.specialite">
          <strong>Spécialité :</strong> {{ u.specialite }}
        </p>
      </div>

      <div class="actions">

        <ng-container *ngIf="!u.archiver; else archived">

          <button class="btn btn-edit"
            [routerLink]="['/admin/modifier-user']"
            [queryParams]="{ id: u.id_user }">
            Modifier
          </button>

          <button class="btn btn-delete"
            (click)="archiver(u.id_user)">
            Archiver
          </button>

        </ng-container>

        <ng-template #archived>
          <span class="archived-text">Utilisateur archivé</span>
        </ng-template>

      </div>

    </div>

  </div>

</div>
