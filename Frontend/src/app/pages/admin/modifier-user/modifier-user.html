<div class="page">


  <div class="left-panel">
    <img src="/logo.png" alt="logo" class="logo">
  </div>
  
 
  <div class="container mt-5">
    <div class="card custom-card shadow p-4">

      <h3 id='h3'class="mb-4 text-center">Modifier User</h3>

      <form >

        <div class="mb-3">
          <input type="text" id="tel" placeholder="tel" class="form-control custom-input"
                 [(ngModel)]="user.tel" name="tel" >
        </div>

        <div class="mb-3">
          <input type="text" id="email"placeholder="Email" class="form-control custom-input"
                 [(ngModel)]="user.email" name="Email" >
        </div>


        
               <div class="buttons">
          <button type="submit" name="enregistrer" class="btn-save" (click)="modifier()">Enregistrer</button>
          <button type="reset" class="btn-cancel" (click)="cancel()">Annuler</button>
        </div>

      </form>
    </div>
  </div>

</div>
