<div class="page">

  <div class="left-panel">
    <img src="logo.png" alt="logo" class="logo">
  </div>
  

  <div class="container">
    <div class="custom-card">

      <h3 id="h3">Créer un Dossier</h3>

      <form (ngSubmit)="creer()">

        <div class="form-row-2">
          <input type="text" placeholder="Nom"
            class="custom-input"
            [(ngModel)]="dossier.nom"
            name="nom">
          <input type="text" placeholder="Prénom"
            class="custom-input"
            [(ngModel)]="dossier.prenom"
            name="prenom">
        </div>

        <div class="form-row-2">
          <input type="number" placeholder="Poids (kg)"
            class="custom-input"
            [(ngModel)]="dossier.poids"
            name="poids">
          <input type="number" placeholder="Taille (cm)"
            class="custom-input"
            [(ngModel)]="dossier.taille"
            name="taille">
        </div>

        <div class="form-row-1">
          <textarea placeholder="Allergie"
            class="custom-input"
            [(ngModel)]="dossier.allergie"
            name="allergie"></textarea>
        </div>

        <div class="form-row-1">
  <textarea placeholder="L'état de santé"
    class="custom-input"
    [(ngModel)]="dossier.etat_sante"
    name="etat_sante"
    autocomplete="off">
  </textarea>
</div>

        <div class="form-row-2">
          <input type="text" placeholder="Diagnostic"
            class="custom-input"
            [(ngModel)]="dossier.diagnostic"
            name="diagnostic">
          <input type="text" placeholder="Traitement"
            class="custom-input"
            [(ngModel)]="dossier.traitement"
            name="traitement">
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>

        <div class="buttons">
          <button type="submit" class="btn-save">Enregistrer</button>
          <button type="reset" class="btn-cancel" (click)="cancel()">Annuler</button>
        </div>

      </form>
    </div>
  </div>

</div>
