<div class="page">

  <!-- PARTIE GAUCHE -->
  <div class="left-panel">
    <img src="assets/images/logo.png" alt="logo" class="logo">
  </div>
  
  <!-- FORM -->
  <div class="container mt-5">
    <div class="card custom-card shadow p-4">

      <h3 id="h3" class="mb-4 text-center">Créer un Dossier</h3>

      <form (ngSubmit)="creer()">

        <!-- Ligne 1 -->
        <div class="row mb-3">
          <div class="col-md-6">
            <input type="text" placeholder="Nom "
              class="form-control custom-input"
              [(ngModel)]="dossier.nom"
              name="nom">
          </div>
          <div class="col-md-6">
            <input type="text" placeholder="Prénom"
              class="form-control custom-input"
              [(ngModel)]="dossier.prenom"
              name="prenom">
          </div></div>
          <div class="row mb-3">
          <div class="col-md-6">
            <input type="number" placeholder="Âge"
              class="form-control custom-input"
              [(ngModel)]="dossier.age"
              name="age">
          </div>
      
             
          <div class="col-md-6">
            <textarea placeholder="Allergie"
              class="form-control custom-input"
              [(ngModel)]="dossier.allergie"
              name="allergie"></textarea>
          </div>
          </div>
                 
        
        <!-- Ligne 3 -->
        <div class="row mb-3">
          <div class="col-md-6">
            <input type="number" placeholder="Poids"
              class="form-control custom-input"
              [(ngModel)]="dossier.poids"
              name="poids">
          </div>

          <div class="col-md-6">
            <input type="number" placeholder="Taille"
              class="form-control custom-input"
              [(ngModel)]="dossier.taille"
              name="taille">
          </div>
        </div>
        <div class="mb-3">
          <textarea placeholder="L'état de santé"
            class="form-control custom-input"
            [(ngModel)]="dossier.etat"
            name="etat"></textarea>
        </div>

        <!-- Ligne 4 -->
        <div class="row mb-4">
          <div class="col-md-6">
            <input type="text" placeholder="Diagnostic"
              class="form-control custom-input"
              [(ngModel)]="dossier.diagnostic"
              name="diagnostic">
          </div>

          <div class="col-md-6">
            <input type="text" placeholder="Traitement"
              class="form-control custom-input"
              [(ngModel)]="dossier.traitement"
              name="traitement">
          </div>
        </div>

        <!-- Boutons -->
        <div class="buttons text-center">
          <button type="submit" class="btn-save me-3">Enregistrer</button>
          <button type="reset" class="btn-cancel" (click)="cancel()">Annuler</button>
        </div>

      </form>
    </div>
  </div>

</div>
