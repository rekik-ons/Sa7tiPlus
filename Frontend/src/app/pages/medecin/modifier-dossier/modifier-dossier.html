<div class="page">

  <!-- PARTIE GAUCHE -->
  <div class="left-panel">
    <img src="/logo.png" alt="logo" class="logo">
  </div>
  
  <!-- FORM -->
  <div class="container mt-5">
    <div class="card custom-card shadow p-4">

      <h3 id='h3'class="mb-4 text-center">Modifier dossier</h3>

      <form (ngSubmit)="modifier()">

        <div class="mb-3">
          <input type="text" id="diagnostic" placeholder="Diagnostic" class="form-control custom-input"
                 [(ngModel)]="dossier.diagnostic" name="Diagnostic" >
        </div>

        <div class="mb-3">
          <input type="text" id="traitement"placeholder="Traitement" class="form-control custom-input"
                 [(ngModel)]="dossier.traitement" name="Traitement" >
        </div>

        <div class="mb-3">
          <textarea placeholder="Description" class="form-control custom-input" id="description"
                    [(ngModel)]="dossier.description" name="description">
          </textarea>
        </div>

        <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
<div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
               <div class="buttons">
          <button type="submit" name="enregistrer" class="btn-save">Enregistrer</button>
          <button type="reset" class="btn-cancel" (click)="cancel()">Annuler</button>
        </div>

      </form>
    </div>
  </div>

</div>
