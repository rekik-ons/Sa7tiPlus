<div class="container-fluid p-0">
  <div class="row g-0 vh-100 align-items-center">

    <div class="col-md-3 side-panel d-flex align-items-start justify-content-center pt-5">
      <div class="logo-container">
        <img src="/logo.png" alt="logo" class="img-fluid">
      </div>
    </div>

    <div class="col-md-9 d-flex justify-content-center">
      <div class="card">
        <div class="card-header">
          <h1>Modifier rendez-vous</h1>
        </div>
        <div class="card-body">

          <div class="row mb-3">
            <div class="col-12 mb-3">
              <input type="date" class="form-control">
            </div>
            <div class="col-12">
              <input type="time" class="form-control" placeholder="Choisir une heure">
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-12">
              <input type="text" class="form-control" placeholder="Spécialité médicale">
            </div>
          </div>

          <div class="row">
            <div class="col-md">
              <button class="btn btn-primary w-100">Prendre un rendez-vous</button>
            </div>
            <div class="col-md">
              <button class="btn btn-secondary w-100">Annuler</button>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>
