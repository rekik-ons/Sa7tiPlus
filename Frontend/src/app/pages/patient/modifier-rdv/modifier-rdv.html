<div class="page">

  <div class="left-panel">
    <img src="logo.png" alt="logo" class="logo">
  </div>

  <div class="form-wrapper">
    <div class="custom-card">

      <h3 id="h3">Modifier le rendez-vous</h3>

      <div class="form-row-2">
        <div>
          <label class="field-label">Date</label>
          <input type="date" class="custom-input" [(ngModel)]="date_rdv">
        </div>
        <div>
          <label class="field-label">Heure</label>
          <input type="time" class="custom-input" [(ngModel)]="heure_rdv">
        </div>
      </div>

      <div *ngIf="successMessage" class="alert-success">{{ successMessage }}</div>
      <div *ngIf="errorMessage" class="alert-danger">{{ errorMessage }}</div>

      <div class="buttons">
        <button class="btn-save" (click)="modifier()">Modifier</button>
        <button class="btn-cancel" (click)="annuler()">Annuler</button>
      </div>

    </div>
  </div>

</div>
