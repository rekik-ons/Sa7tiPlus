<div class="page">

  <div class="left-panel">
    <img src="logo.png" alt="logo" class="logo">
  </div>

  <div class="container">
    <div class="custom-card">

      <div class="card-header">
        <h1>Prendre un rendez-vous</h1>
      </div>

      <div class="row-2">
        <div>
          <label class="field-label">Date</label>
          <input type="date" class="custom-input" [(ngModel)]="date_rdv">
        </div>
        <div>
          <label class="field-label">Heure</label>
          <input type="time" class="custom-input" [(ngModel)]="heure_rdv">
        </div>
      </div>

      <div class="row">
        <label class="field-label">Spécialité</label>
        <select class="custom-input" [(ngModel)]="specialite"
                (ngModelChange)="onSpecialiteChange($event)">
          <option value="" disabled selected>Choisir une spécialité</option>
          <option value="Cardiologie">Cardiologie</option>
          <option value="Dermatologie">Dermatologie</option>
          <option value="Généraliste">Généraliste</option>
          <option value="Pédiatre">Pédiatre</option>
          <option value="Ophtalmologie">Ophtalmologie</option>
        </select>
      </div>

      <div *ngIf="specialite && !id_medecin" class="alert-warning show" style="margin-top:12px; margin-bottom:0;">
        Aucun médecin disponible pour cette spécialité.
      </div>

      <div *ngIf="successMessage" class="alert-success show">{{ successMessage }}</div>
      <div *ngIf="errorMessage" class="alert-danger show">{{ errorMessage }}</div>

      <div class="buttons">
        <button class="btn-save" (click)="soumettre()">Prendre un rendez-vous</button>
        <button class="btn-cancel" (click)="annuler()">Annuler</button>
      </div>

    </div>
  </div>

</div>
