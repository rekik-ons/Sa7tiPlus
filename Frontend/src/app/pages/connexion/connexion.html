<div class="container-fluid p-0 m-0">
  <div class="row g-0" style="height: 100vh;">

    <div class="side-panel d-flex align-items-start justify-content-center pt-5">
      <div class="logo-container">
        <img src="/logo.png" alt="logo" class="img-fluid">
      </div>
    </div>

    <div class="main-content d-flex align-items-center justify-content-center">
      <div class="card shadow">
        <div class="card-body">
          <h1 class="text-center">Connexion</h1>
          <div *ngIf="errorMessage" class="alert alert-danger mt-2">{{ errorMessage }}</div>
          <div class="mb-4 mt-4">
            <input type="text" id="login" class="form-control" [(ngModel)]="login" placeholder="Login">
          </div>
          <div class="mb-4">
            <input type="password" class="form-control" id="pwd" [(ngModel)]="password" placeholder="Mot de passe">
          </div>
          <button id="connect" class="btn btn-info w-100" (click)="onSubmit()">
            Se Connecter
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
