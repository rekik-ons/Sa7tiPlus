<div class="page-wrapper">
  <aside class="sidebar">

  <img src="/logo.png" class="logo">

  <nav class="nav-filtres">
    <button *ngFor="let f of filtres"
      class="filtre-btn"
      [class.active]="filtreActif === f"
      (click)="setFiltre(f)">
      {{ f }}
    </button>
  </nav>

</aside>


  <main class="main-content">
    <div class="list-card">
      <h2 class="list-title">Liste des RDV</h2>

      <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

      <div *ngIf="loading" class="loading-state">
        <div class="spinner-lg"></div>
      </div>

      <div *ngIf="!loading && filteredRdvList.length === 0" class="empty-state">
        Aucun rendez-vous {{ filtreActif !== 'Tous' ? filtreActif.toLowerCase() : '' }}
      </div>

      <div class="rdv-list">
        <div *ngFor="let rdv of filteredRdvList" class="rdv-item">
          <div class="rdv-header">
            <span class="patient-name">{{ rdv.patientNom || 'Patient #' + rdv.patientId }}</span>
            <span class="statut-badge" [class]="'badge-' + rdv.statut.toLowerCase().replace('é','e')">
              {{ rdv.statut }}
            </span>
          </div>

          <div class="rdv-meta">
            <span>Date : {{ rdv.date }}</span>
            <span>Heure : {{ rdv.heure }}</span>
          </div>

          <div class="rdv-actions">
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" [name]="'statut-' + rdv.id"
                  value="Confirmé" [checked]="rdv.statut === 'Confirmé'"
                  (change)="setStatut(rdv, 'Confirmé')"/>
                <span class="radio-dot"></span>
                Confirmé
              </label>
              <label class="radio-label">
                <input type="radio" [name]="'statut-' + rdv.id"
                  value="Reporté" [checked]="rdv.statut === 'Reporté'"
                  (change)="setStatut(rdv, 'Reporté')"/>
                <span class="radio-dot"></span>
                Reporté
              </label>
            </div>
            <button class="btn-supprimer" (click)="supprimer(rdv.id)">Supprimer</button>
          </div>
        </div>
      </div>

      <div class="bottom-row">
        <button class="btn btn-primary" (click)="envoyer()">Envoyer</button>
        <button class="btn btn-secondary" (click)="quitter()">Quitter</button>
      </div>
    </div>
  </main>
</div>
